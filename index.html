<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Iberostar Aruba">
    <meta name="format-detection" content="telephone=no">

    <link rel="apple-touch-icon" href="assets/Logos/app_logo_club.png?v=200">
    <link rel="shortcut icon" href="assets/Logos/app_logo_club.png?v=200" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <title>Iberostar Aruba</title>

    <script src="js/image-utils.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <div class="ocean-waves" aria-hidden="true"></div>
    <div class="palm-shadows" id="palmShadows" aria-hidden="true"></div>
    <div class="night-glow" id="nightGlow" aria-hidden="true"></div>
    <div class="clouds" id="clouds" aria-hidden="true"></div>
    <div class="living-fish" id="fish" aria-hidden="true"></div>
    <div class="living-dolphin" id="dolphin" aria-hidden="true"></div>
    <div class="living-birds" id="birds" aria-hidden="true"></div>
    <div class="fireflies" id="fireflies" aria-hidden="true"></div>
    <div class="stars-overlay" id="stars" aria-hidden="true"></div>
    <div class="living-star" id="shootingStar" aria-hidden="true"></div>
    <div class="horizon-boat" id="boat" aria-hidden="true"></div>
    <div id="modeToast" role="status" aria-live="polite">Mode: Auto</div>

    <div id="splash" aria-hidden="true">
        <img id="splashLogo" src="assets/Logos/logo_club.png" alt="" class="splash-logo" onerror="handleImgError(this)">
    </div>

    <nav id="mainNav" aria-label="Sections">
        <button class="nav-btn active" id="nav-club" onclick="nav('portfolio')" title="Club" aria-label="Club" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
        <button class="nav-btn" id="nav-dining" onclick="nav('dining')" title="Dining" aria-label="Dining"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg></button>
        <button class="nav-btn" id="nav-fun" onclick="nav('activities')" title="Fun" aria-label="Activities"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg></button>
        <button class="nav-btn" id="nav-spa" onclick="nav('spa')" title="Wellness" aria-label="Wellness"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C9 7 4 9 4 14c0 3 3 5 8 5s8-2 8-5c0-5-5-7-8-12zm0 18c-4.4 0-8-1.8-8-5 0-2.4 2.3-4.5 5-5.8 1.5 1.7 3 3.4 3 5.8 0-2.4 1.5-4.1 3-5.8 2.7 1.3 5 3.4 5 5.8 0 3.2-3.6 5-8 5z"/></svg></button>
        <button class="nav-btn" id="nav-golf" onclick="nav('golf')" title="Golf" aria-label="Golf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 19.5c-1 0-1.7-.6-2.1-1.5l-2.9-6.2c-.2-.4-.3-.8-.3-1.3 0-.2 0-.4.1-.6l.5-1.9c.2-.8-.2-1.7-1-2L12 5.5c-.1 0-.2-.1-.3-.1-1 0-1.8.7-2 1.7l-.3 1.7c-.2.9-.9 1.6-1.8 1.9l-2.1.6C4.7 11.6 4 12.4 4 13.3v.2c0 1 .6 1.9 1.5 2.3l2.2.9c.8.3 1.3 1.1 1.3 1.9v1.1c0 1.5 1.2 2.8 2.8 2.8h5.9c1 0 1.8-.8 1.8-1.8v-1.2zm-10-17c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg></button>
        <button class="nav-btn" id="nav-store" onclick="nav('store')" title="Shopping" aria-label="Shopping"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg></button>
    </nav>

    <main id="mainContainer">
        <header>
            <div class="header-top">
                <img id="headerLogo" src="assets/Logos/logo_club.png" alt="Iberostar Aruba" class="header-logo" onerror="handleImgError(this)">
                <div class="greeting-wrap" onclick="toggleTimeMode()" role="button" tabindex="0" aria-label="Toggle time-of-day theme" onkeydown="if(event.key==='Enter')toggleTimeMode()">
                    <div class="greeting" id="greeting">Bon Bini</div>
                    <div class="date-display" id="dateDisplay">...</div>
                </div>
            </div>

            <h1 id="pageTitle" data-text="Iberostar Aruba">Iberostar Aruba</h1>
            <p class="subtitle" id="pageSub">Experience the ultimate Iberostar hotels on Aruba.</p>

            <div class="search-container" id="searchBox">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search experiences, shops, tags..." aria-label="Search experiences, shops, tags" onkeyup="filterContent()" onfocus="handleKeyboard(true)" onblur="handleKeyboard(false)">
                <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Clear search">✕</button>
            </div>
        </header>

        <div id="appContent"></div>
    </main>

    <div class="modal-wrap" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="dTitle">
        <div class="modal">
            <div class="modal-drag-handle" aria-hidden="true"></div>
            <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close" ontouchstart="closeModal(event)" onclick="closeModal(event)">✕</button>

            <div class="modal-hero" onclick="launchLightbox(currentGallery, 0)" role="button" tabindex="0" aria-label="Expand photo" onkeydown="if(event.key==='Enter')launchLightbox(currentGallery, 0)">
                <img id="dImg" src="" alt="" onerror="handleImgError(this)" onload="handleImgLoad(this)">
                <div class="image-spinner active" aria-hidden="true"></div>
                <div style="position:absolute; bottom:20px; right:20px; background:rgba(0,0,0,0.65); padding:8px 16px; border-radius:20px; color:#FFFFFF; font-size:11px; font-weight:800; backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); border: 1px solid rgba(255,255,255,0.2); box-shadow:0 4px 16px rgba(0,0,0,0.3); letter-spacing:1px; pointer-events:none; z-index:20;" aria-hidden="true">TAP TO EXPAND</div>
            </div>

            <div class="modal-content" id="modalContentScroll">
                <div class="modal-meta"><span id="dSub">SUBTITLE</span><h2 id="dTitle">Title</h2></div>
                <div class="action-bar" id="dAction"></div>
                <div id="dInfoGrid" class="info-grid"></div>
                <div id="dDetails" class="details-section"></div>
                <p class="modal-desc" id="dDesc">Description.</p>
                <h4 id="dGalleryHeading" style="margin-top:50px; color:var(--text-main); font-size:1.6rem; letter-spacing:-0.5px; font-family:var(--font-head); font-weight:700;">Gallery</h4>
                <div class="gallery-scroller" id="dGallery"></div>
            </div>
        </div>
    </div>

    <div class="fs-viewer" id="fsViewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="fs-close" onclick="closeFs()" aria-label="Close photo viewer">✕</button>
        <button class="fs-nav fs-prev" id="fsPrev" onclick="prevFs()" aria-label="Previous photo">‹</button>
        <button class="fs-nav fs-next" id="fsNext" onclick="nextFs()" aria-label="Next photo">›</button>
        <div class="fs-backdrop" id="fsBackdrop" aria-hidden="true"></div>
        <div id="fsContent" style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; -webkit-overflow-scrolling: touch;"></div>
        <div class="fs-caption" id="fsCaption">1 / 5</div>
    </div>

</body>
</html>
