<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Staff training for OPCs: Aruba guest qualifications and the Open House invitation pitch.">
<meta name="theme-color" content="#0a6b78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Show-Up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Show-Up Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. The worker's pass on top; every level, question and game is printed on an "invitation" ticket with a perforated stub. */
:root{
  --bg:#eef6f6; --surface:#ffffff; --sunk:#e2eeef; --ink:#0d2a30; --muted:#4f6a70; --line:#cfe1e2;
  --lagoon:#0a6b78; --lagoon-ink:#ffffff; --sun:#f5b301; --sun-ink:#3b2a00;
  --good:#16834a; --good-bg:#e3f5ea; --bad:#c8323b; --bad-bg:#fbe7e8; --lock:#8fa5a8;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071a1e; --surface:#0e272d; --sunk:#0a2126; --ink:#e4f1f2; --muted:#93adb1; --line:#1f3f46;
  --lagoon:#3cc3d1; --lagoon-ink:#04191c; --sun:#ffc93c; --sun-ink:#2a1e00;
  --good:#4fd18a; --good-bg:#0f3423; --bad:#ff6b72; --bad-bg:#3a1418; --lock:#4e6a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071a1e; --surface:#0e272d; --sunk:#0a2126; --ink:#e4f1f2; --muted:#93adb1; --line:#1f3f46;
  --lagoon:#3cc3d1; --lagoon-ink:#04191c; --sun:#ffc93c; --sun-ink:#2a1e00;
  --good:#4fd18a; --good-bg:#0f3423; --bad:#ff6b72; --bad-bg:#3a1418; --lock:#4e6a6f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 56px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--lagoon)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font:700 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--lagoon);color:var(--lagoon-ink);min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.wide{width:100%;font-size:17px;padding:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;font-size:14px;min-height:32px}

/* Worker's pass */
.pass{display:grid;grid-template-columns:1fr 84px;background:var(--lagoon);color:var(--lagoon-ink);border-radius:18px;position:relative;overflow:hidden}
.pass .main{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pass .eyebrow{color:inherit;opacity:.8}
.pass h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
.pass .who{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 12px}
.pass .who b{font-family:var(--f-mono);font-weight:700}
.pass .stub{border-left:2px dashed color-mix(in srgb,var(--lagoon-ink) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;font-family:var(--f-mono)}
.pass .stub b{font-size:24px;line-height:1}
.pass .stub span{font-size:10px;letter-spacing:.12em}
.pass::before,.pass::after,.ticket::before,.ticket::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.pass::before,.pass::after{right:76px}
.pass::before{top:-8px}.pass::after{bottom:-8px}

.name-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.name-row label{flex-basis:100%}
.name-row input{flex:1 1 180px;min-width:0;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}

/* Next up */
.today{background:var(--surface);border:2px solid var(--sun);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.today h2{font-size:22px}

/* Tracks and levels */
.track{display:flex;flex-direction:column;gap:10px}
.track-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.track-h h2{font-size:24px;font-weight:800}
.level{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.level .num{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--f-mono);border:2px solid var(--lagoon);color:var(--lagoon)}
.level.done .num{background:var(--lagoon);color:var(--lagoon-ink)}
.level.locked{opacity:.62}
.level.locked .num{border-color:var(--lock);color:var(--lock)}
.level h3{font-size:19px}
.level .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.level .actions{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.level.final{border:2px solid var(--lagoon)}
.chip{font:700 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.due{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.chip.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}

/* Games */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.game-card h3{font-size:19px}
.game-card .big{font:700 28px/1 var(--f-mono)}
.game-card .btn{margin-top:auto}
.game-card.locked{opacity:.62}
@media (max-width:420px){.games{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:19px}
.weak ul{padding-left:18px;display:flex;flex-direction:column;gap:8px}
.ans{color:var(--good);font-weight:700}
.method{padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .x{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:700 18px/1 var(--f-mono);flex:none}
.topbar .t{flex:1;min-width:0}
.topbar .t h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Study */
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.note h3{font-size:18px}
.note ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.say{border-left:4px solid var(--sun);padding:6px 0 6px 12px;font-style:italic}
.flyer{margin:0;display:flex;flex-direction:column;gap:6px}
.flyer img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--sunk)}

/* Game HUD */
.streak{display:flex;align-items:baseline;gap:6px;background:var(--sun);color:var(--sun-ink);padding:6px 12px;border-radius:999px;font:700 14px/1.2 var(--f-mono);flex:none}
.streak.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.bar{display:flex;gap:3px;height:8px}
.bar i{flex:1;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--lagoon)}
.bar i.best{background:color-mix(in srgb,var(--sun) 55%,var(--line))}

/* Ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:1fr 64px;position:relative}
.ticket .body{padding:20px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ticket .stub{border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--sunk);border-radius:0 15px 15px 0;font-family:var(--f-mono)}
.ticket .stub b{font-size:22px;color:var(--lagoon)}
.ticket .stub span{font-size:10px;letter-spacing:.1em;color:var(--muted)}
.ticket::before,.ticket::after{right:56px;border:1px solid var(--line)}
.ticket::before{top:-9px;clip-path:inset(50% 0 0 0)}
.ticket::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.ticket .q{font:700 21px/1.3 var(--f-display);text-wrap:pretty}
.ticket.shake{animation:shake .4s ease}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--sun);text-align:center;color:var(--muted)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;transition:border-color .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--lagoon)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:700 14px/1 var(--f-mono);background:var(--sunk);color:var(--muted)}
.opt .txt{min-width:0}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}

.feedback{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback h3{font-size:20px}
.feedback.good h3{color:var(--good)}
.feedback.bad h3{color:var(--bad)}
.feedback .why{font-size:15px}
.feedback ol{padding-left:22px;display:flex;flex-direction:column;gap:2px;font-size:15px}

/* Pitch map */
.map{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:step}
.map li{counter-increment:step;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;border:2px dashed var(--line);min-height:48px;color:var(--muted)}
.map li::before{content:counter(step);font:700 14px/30px var(--f-mono);text-align:center;width:30px;height:30px;border-radius:50%;background:var(--sunk);color:var(--muted)}
.map li.set{border-style:solid;border-color:var(--lagoon);background:var(--surface);color:var(--ink)}
.map li.set::before{background:var(--lagoon);color:var(--lagoon-ink)}
.map li b{font-family:var(--f-display);font-size:16px}
.map li span{display:block;font-size:14px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px}
.card-btn{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px;font-size:16px}
.card-btn:hover:not(:disabled){border-color:var(--lagoon)}
.card-btn.wrong{border-color:var(--bad);background:var(--bad-bg)}
.round{font:700 13px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--lagoon)}

/* Lightning */
.clock{display:flex;align-items:center;gap:12px}
.clock .track-bar{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.clock .fill{height:100%;width:100%;background:var(--sun);transform-origin:left;border-radius:999px}
.clock .fill.low{background:var(--bad)}
.clock b{font:700 22px/1 var(--f-mono);min-width:3ch;text-align:right}
.score{font:800 56px/1 var(--f-display);color:var(--lagoon)}
.gq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gq button{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.gq button b{font:800 26px/1 var(--f-display)}
.gq button span{font-size:12px;color:var(--muted)}
.gq button:hover{border-color:var(--lagoon)}
.gq button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.flash{animation:flash .3s ease}
@keyframes flash{0%{background:var(--good-bg)}100%{background:var(--surface)}}

/* Listen */
.clips{display:flex;flex-direction:column;gap:10px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.clip.on{border:2px solid var(--lagoon)}
.clip-h{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--lagoon);color:var(--lagoon-ink);display:grid;place-items:center}
.play svg{width:22px;height:22px;fill:currentColor}
.clip-h h3{font-size:17px}
.clip-h .meta{font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.heard{color:var(--good);font-weight:700}
.speed{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font:700 13px/1 var(--f-mono);min-height:36px}
.seek{width:100%;accent-color:var(--lagoon);margin:0}
.tx{max-height:240px;overflow-y:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px;position:relative}
.seg{background:none;border:0;text-align:left;padding:6px 8px;border-radius:8px;font-size:15px;line-height:1.45;color:var(--muted)}
.seg:hover{background:var(--sunk)}
.seg.now{background:var(--sunk);color:var(--ink);box-shadow:inset 3px 0 0 var(--sun)}
.seg time{font:500 11px/1 var(--f-mono);color:var(--muted);margin-right:6px}

/* Win */
.win{display:flex;flex-direction:column;gap:14px}
.win h2{font-size:34px;font-weight:800}
.cert{border:3px double var(--lagoon);border-radius:16px;padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.cert .who{font:800 30px/1.1 var(--f-display);color:var(--lagoon)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font:700 22px/1.1 var(--f-mono)}
.stats span{font-size:12px;color:var(--muted)}

/* Report and coach */
.report{width:100%;min-height:220px;font:14px/1.5 var(--f-mono);padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.roster{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.roster li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r1 b{font-size:17px;min-width:0;overflow-wrap:anywhere}
.r1 .mono{margin-left:auto}
.r2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--muted)}
.r2 b{color:var(--ink)}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--lagoon)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}

.foot{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx" aria-hidden="true" hidden></canvas>

<script>
"use strict";
/* =====================================================================
   CONTENT
   Sources: "Qualifications Aruba, 2 March 2026" (PDF) and the trainer's
   nine voice notes of 29 Sept 2026.
   ===================================================================== */
const Q = (id, q, a, w, why) => ({ id, q, a, w, why });
const LINE = (id, q, a, w, why) => ({ id, q, a, w, why, line: true });

const TRACKS = [
  { id: "qualify", name: "Qualify", sub: "Who gets which gift", levels: ["q", "ctnq", "who"] },
  { id: "pitch", name: "The pitch", sub: "Solid bookings that show up", levels: ["why", "offer", "solid", "map"] }
];

const LEVELS = [
{
  id: "q", name: "Qualified guests", sub: "Q · full gift",
  notes: [
    { h: "USA & Canada · Q (full gift)", li: [
      "Ages 32 to 70. The man's age counts. In a same-sex couple, either one.",
      "Married or living together.",
      "Single women: USA only, ages 40 to 65.",
      "One of them employed or retired.",
      "Visa, Mastercard, American Express or Discover.",
      "Both fluent in English, or both fluent in Spanish.",
      "Staying at a hotel, timeshare or rental, and paying for it." ] },
    { h: "Latin America & Caribbean · Q", li: [
      "Not Aruba, Cuba, Venezuela, Haiti or Ecuador.",
      "Ages 40 to 60. The man's age counts.",
      "Married or living together. No singles.",
      "One must be employed. No retirees.",
      "Visa, Mastercard or Amex. No Discover.",
      "Same language and paid-accommodation rules." ] },
    { h: "Argentina · Q", li: [ "Ages 45 to 55. The man's age counts." ] },
    { h: "Time they need", li: [
      "Presentation: 90 minutes, breakfast included.",
      "They need 3 free hours that morning, with no paid activities.",
      "Departure day: 4 hours before airport pickup, or 5 hours before the flight if they rent a car." ] }
  ],
  qs: [
    Q("q1","USA or Canada couple. What ages get the full gift (Q)?","32 to 70",["28 to 70","35 to 65","40 to 60"],"USA & Canada Q is 32 to 70. Ages 28 to 31 and 71+ are CT, half gift."),
    Q("q2","In a couple, whose age decides if they qualify?","The man's age",["The woman's age","Whoever is older","The average of both"],"The man qualifies the age."),
    Q("q3","Same-sex couple. Whose age counts?","Either one of them",["Only the oldest","Only the youngest","Same-sex couples can't qualify"],"In a same-sex couple, either partner can qualify the age."),
    Q("q4","Which single guests can be Q?","Single women from the USA, 40 to 65",["Any single from USA or Canada, 32 to 70","Single men from the USA, 40 to 65","No singles ever qualify"],"Only single women, only from the USA, only ages 40 to 65."),
    Q("q5","USA or Canada Q. What's the work rule?","One of them employed or retired",["Both must be employed","No retirees allowed","Work doesn't matter"],"USA & Canada: one must be gainfully employed or retired."),
    Q("q6","Which cards work for a USA or Canada Q?","Visa, Mastercard, Amex or Discover",["Visa or Mastercard only","Any debit card","A cash deposit"],"USA & Canada Q: Visa, Mastercard, American Express or Discover."),
    Q("q7","What's the language rule?","Both fluent in English, or both fluent in Spanish",["One of them speaks English","Any language with a translator","English only"],"Both must speak the same language fluently: English or Spanish."),
    Q("q8","What's the accommodation rule?","Staying at a hotel, timeshare or rental, and paying for it",["Anywhere, even free at a friend's place","Only guests of Iberostar hotels","Only all-inclusive guests"],"They must be paying for where they stay."),
    Q("q9","How long is the presentation?","90 minutes, breakfast included",["45 minutes","60 minutes plus breakfast","2 hours"],"90 minutes including breakfast."),

}

function scenarioQ(s, id){
  const opts = ["Q","CT","NQ"].map(k => GRADE[k]);
  return { id, q:s.q, a:GRADE[s.g], g:s.g, w:opts.filter(o => o !== GRADE[s.g]), why:s.why, fixed:opts, scen:true };
}
function fixedScen(f){ return scenarioQ({ q:f[0], g:f[1], why:f[2] }, "fx" + FIXED_SCEN.indexOf(f)); }
function buildScenarios(n){
  const out = shuffle(FIXED_SCEN.slice()).slice(0, Math.round(n/3)).map(fixedScen);
  const seen = new Set(out.map(o => o.q));
  let guard = 0;
  while (out.length < n && guard++ < 500){ const s = genScenario(); if (seen.has(s.q)) continue; seen.add(s.q); out.push(scenarioQ(s, "gen")); }
  return shuffle(out);
}

let ac;
function tone(kind){
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const set = { ok:[[660,"triangle"],[880,"triangle"]], bad:[[220,"sawtooth"],[165,"sawtooth"]], win:[[523,"triangle"],[659,"triangle"],[784,"triangle"],[1047,"triangle"]], tick:[[1200,"square"]] }[kind];
    set.forEach(([f,type],i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*0.09;
      o.type=type; o.frequency.value=f;
      const peak = kind==="bad"?0.06:kind==="tick"?0.03:0.11;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="tick"?0.05:0.16));
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.2);
    });
  } catch(e){}
}
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
let fxRaf = 0;
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("fx"), x = c.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio||1);
  const W = innerWidth, H = innerHeight;
  c.width = W*dpr; c.height = H*dpr; c.hidden = false;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--lagoon","--sun","--good","--bad"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length:150}, () => ({ x:W/2+(Math.random()-.5)*120, y:H*.32, vx:(Math.random()-.5)*10, vy:-Math.random()*12-4, r:5+Math.random()*6, a:Math.random()*6.3, va:(Math.random()-.5)*.3, c:pick(cols) }));
  const t0 = performance.now(); let last = t0;
  cancelAnimationFrame(fxRaf);
  (function f(t){
    const dt = Math.min(32, t-last)/16; last = t;
    x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
    for (const p of P){ p.vy += .32*dt; p.vx *= .99; p.x += p.vx*dt; p.y += p.vy*dt; p.a += p.va*dt; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    if (t - t0 < 2400) fxRaf = requestAnimationFrame(f); else { x.clearRect(0,0,W,H); c.hidden = true; }
  })(t0);
}
let toastT = 0;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n => n.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);

const DAILY = { id:"daily", name:"Daily 10", sub:"Spaced review", notes:[] };
function play(id){

  if (L.gen) list = buildScenarios(L.count);
  else if (L.final){ const pool = shuffle(ALL_QS.slice()).slice(0, L.count-6); list = shuffle(pool.concat(buildScenarios(6))); }

function buildDaily(){
  const pool = LEVELS.filter(l => l.qs && S.mastered[l.id]).flatMap(l => l.qs);
  const bag = pool.map(q => ({ q, w: 1 + 2*Math.min(3, S.misses[q.id]||0) })), picked = [];
  const want = Math.min(S.mastered.who ? 8 : 10, bag.length);
  while (picked.length < want && bag.length){
    let r = Math.random() * bag.reduce((a,b) => a + b.w, 0), k = 0;
    while (k < bag.length - 1 && (r -= bag[k].w) > 0) k++;
    picked.push(bag.splice(k,1)[0].q);
  }
  const extra = S.mastered.who ? buildScenarios(10 - picked.length) : [];
  return shuffle(picked.concat(extra));
}

function tapStep(i, btn){
  const g = game; if (!g || g.kind !== "map" || g.locked) return;

    g.step++; addXP(5); tone("ok"); buzz(12);
    if (g.step === MAP_STEPS.length){
      if (g.round === 0){ g.round = 1; g.step = 0; g.order = shuffle(MAP_STEPS.map((_,k) => k)); save(); return renderMap("Round 1 done. Now the lines you actually say."); }
      save(); return masterLevel(g.L, MAP_STEPS.length*2, Date.now() - g.t0);
    }
    save(); return renderMap();
  }

const LG_MS = 60000;
function lightningIntro(){

function nextCouple(seen){
  for (let k = 0; k < 60; k++){
    const s = Math.random() < 0.3 ? (f => ({ q:f[0], g:f[1], why:f[2] }))(pick(FIXED_SCEN)) : genScenario();
    if (!seen.has(s.q)){ seen.add(s.q); return s; }
  }
  return genScenario();
}
function startLightning(){
  const seen = new Set();

  view = "lightning";
  show(`
  <div class="topbar"><button class="x" id="quit" aria-label="Stop and go back">×</button><div class="t"><p class="eyebrow">Record ${S.lightning||0}</p><h2>Lightning round</h2></div>

  <article class="ticket" id="tk"><div class="body"><p class="eyebrow">Couple</p><p class="q" id="cq"></p></div><div class="stub" aria-hidden="true"><b id="cn">1</b><span>COUPLE</span></div></article>

  (function tick(){
    const g = game; if (!g || g.kind !== "lightning" || g.over) return;
    const left = g.end - Date.now();

    fill.style.transform = `scaleX(${left/LG_MS})`;
    const s = Math.ceil(left/1000);

function answerL(choice, btn){

const AUD = new Audio();
AUD.preload = "none";
let curClip = null, lastSeg = -1;
const triedBlob = {};
const ICON_PLAY = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`;
const ICON_PAUSE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`;

function bindClips(){
  app.querySelectorAll("[data-play-clip]").forEach(b => b.onclick = () => toggleClip(b.dataset.playClip));

    const go = () => { try { AUD.currentTime = t; } catch(e){} };
    if (AUD.readyState >= 1) go(); else AUD.addEventListener("loadedmetadata", go, { once:true });

  });

}
function loadClip(id){
  curClip = id; lastSeg = -1; AUD.src = `audio/${id}.mp3`; AUD.playbackRate = AUD.defaultPlaybackRate || 1;
  const c = clipById(id);
  try { if ("mediaSession" in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title:c.t, artist:"Show-Up Academy", album:"Trainer's voice notes" }); } catch(e){}
}
function toggleClip(id){
  if (curClip === id && !AUD.paused){ AUD.pause(); return; }
  if (curClip !== id) loadClip(id);
  AUD.play().catch(audioFail);
  syncClipUI();
}
let failedClip = null;
async function audioFail(e){
  if (view !== "listen" && view !== "study") return;
  if (e && e.name === "AbortError") return;
  if (e && e.name === "NotAllowedError"){ toast("Tap play again to start the audio."); return; }
  const id = curClip; if (!id || failedClip === id) return;
  if (!triedBlob[id]){
    triedBlob[id] = true;
    try {
      const res = await fetch(`audio/${id}.mp3`); if (!res.ok) throw new Error(String(res.status));
      AUD.src = URL.createObjectURL(await res.blob()); await AUD.play(); return;
    } catch(err){}
  }
  failedClip = id;
  if (view !== "listen" && view !== "study") return;
  toast("This voice note won't play here. Its words are in the transcript.");
  const tx = app.querySelector(`[data-tx="${id}"]`); if (tx) tx.hidden = false;
}
AUD.addEventListener("error", () => { if (AUD.src) audioFail({ name:"MediaError" }); });
function syncClipUI(){
  app.querySelectorAll("[data-clip]").forEach(el => {
    const id = el.dataset.clip, active = id === curClip, playing = active && !AUD.paused;
    el.classList.toggle("on", active);
    const b = el.querySelector("[data-play-clip]");
    b.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    b.setAttribute("aria-label", (playing ? "Pause " : "Play ") + clipById(id).t);
    el.querySelector("[data-seek]").hidden = !active;
    el.querySelector("[data-speed]").hidden = !active;
    if (active) el.querySelector("[data-tx]").hidden = false;
  });
}
AUD.addEventListener("play", syncClipUI);
AUD.addEventListener("pause", syncClipUI);
AUD.addEventListener("timeupdate", () => {
  if (!curClip) return;
  const c = clipById(curClip), t = AUD.currentTime;

  }

  let k = -1; for (let i = 0; i < c.s.length; i++){ if (c.s[i][0] <= t + 0.15) k = i; else break; }

    if (s){ s.classList.add("now"); const box = s.parentElement; box.scrollTop = s.offsetTop - box.offsetTop - 48; }
  }
});
AUD.addEventListener("ended", () => {

/* =====================================================================
   PROGRESS REPORT (for WhatsApp) and COACH SCREEN

const LEVEL_IDS = ["q","ctnq","who","why","offer","solid","map","final"];
const b64e = s => { const b = new TextEncoder().encode(s); let bin = ""; b.forEach(c => bin += String.fromCharCode(c)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const b64d = s => { s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };
function topMisses(n){ return Object.entries(S.misses).filter(([id]) => QBY[id]).sort((a,b) => b[1]-a[1]).slice(0,n); }
function reportText(){
  const lv = id => { const L = byId(id); return S.mastered[id] ? `${L.name} ✔` : S.best[id] ? `${L.name} ${S.best[id]}/${levelTotal(L)}` : `${L.name} –`; };
  const heard = CLIPS.filter(c => S.listened[c.id]).length;
  const payload = { v:1, n:(S.name||"").slice(0,30), x:S.xp||0, m:Object.fromEntries(LEVEL_IDS.map(id => [id, S.mastered[id]?.count||0])), l:S.lightning||0, d:dayStreak(), h:heard, w:topMisses(8), t:Date.now() };
  const miss = topMisses(3).map(([id,n]) => `"${QBY[id].q.length > 60 ? QBY[id].q.slice(0,58) + "…" : QBY[id].q}" (${n}×)`);
  return [
    `Show-Up Academy progress`,

    `Qualify: ${TRACKS[0].levels.map(lv).join(" · ")}`,

/* Reports are pasted from chats: treat every field as untrusted. */
function parseReports(text){
  const out = [], re = /#SUA1-([A-Za-z0-9_-]{8,6000})/g; let m;
  while ((m = re.exec(text))){
    try {
      const p = JSON.parse(b64d(m[1]));
      if (!p || typeof p !== "object" || Array.isArray(p)) continue;
      const num = (v, max) => Number.isFinite(+v) ? Math.max(0, Math.min(max, Math.round(+v))) : 0;
      const name = String(p.n||"").replace(/[\u0000-\u001f\u007f]/g,"").trim().slice(0,30) || "No name";
      const lv = o => Object.fromEntries(LEVEL_IDS.map(id => [id, num(o && typeof o === "object" ? o[id] : 0, 999)]));
      const w = Array.isArray(p.w) ? p.w.filter(x => Array.isArray(x) && typeof x[0] === "string" && QBY[x[0]]).slice(0,8).map(x => [x[0], num(x[1], 9999)]) : [];
      out.push({ n:name, x:num(p.x, 1e7), m:lv(p.m), l:num(p.l, 999), d:num(p.d, 9999), h:num(p.h, CLIPS.length), w, t:num(p.t, 4e12) });
    } catch(e){}
  }
  return out;
}

    <p class="eyebrow">Team · ${R.length === 1 ? "1 person" : R.length + " people"}</p>
    <ul class="roster">${R.map(r => `<li>
      <div class="r1"><b>${esc(r.n)}</b>${r.m.final ? `<span class="chip ok">Show-Up Pro</span>` : ""}<span class="mono small muted">${esc(new Date(r.t).toLocaleDateString("en-US",{month:"short",day:"numeric"}))}</span></div>
      <div class="r2"><span class="dots" role="img" aria-label="${done(r)} of ${LEVEL_IDS.length} levels mastered">${LEVEL_IDS.map(id => `<i class="${r.m[id]?"on":""}"></i>`).join("")}</span><span class="mono">${done(r)}/${LEVEL_IDS.length}</span><span>Lightning <b class="mono">${r.l}</b></span><span>Streak <b class="mono">${r.d}d</b></span><span>Notes <b class="mono">${r.h}/${CLIPS.length}</b></span></div>
    </li>`).join("")}</ul>
    <p class="small muted">Dots in order: ${LEVEL_IDS.map(id => byId(id).name).join(" · ")}.</p>
  </section>
  ${teamWeak.length ? `<section class="panel weak"><p class="eyebrow">What the team misses most</p><p class="small muted">Coach these at the next meeting.</p><ul>${teamWeak.map(([id,n]) => `<li>${esc(QBY[id].q)}<br><span class="ans">${esc(QBY[id].a)}</span> <span class="mono muted small">· missed ${n}×</span></li>`).join("")}</ul></section>` : ""}
  <span class="confirm" id="clrBox"><button class="link" id="clr">Clear coach data</button></span>` : `<p class="panel small muted">No reports yet. When you paste the first one, your team shows up here with levels mastered, Lightning records and what they miss most.</p>`}`);
  on("#back", renderHome);
  on("#add", () => {
    const got = parseReports($("#paste").value);
    if (!got.length){ $("#addMsg").textContent = "No report codes found. Each report ends with a line that starts with #SUA1-."; return; }
    S.coach = S.coach || {};
    got.forEach(r => { const k = r.n.toLowerCase(); if (!S.coach[k] || S.coach[k].t <= r.t) S.coach[k] = r; });
    save(); toast(`Added ${plural(got.length,"report")}.`); coach();
  });
  on("#clr", () => {
    $("#clrBox").innerHTML = `<span>Remove all pasted reports from this phone?</span><button class="btn ghost" id="no">Keep</button><button class="btn danger" id="yes">Clear</button>`;
    on("#no", coach); on("#yes", () => { S.coach = {}; save(); coach(); });
  });
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
document.addEventListener("keydown", e => {
  if (!game || /INPUT|TEXTAREA/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (game.kind === "run" && !game.locked){
    const n = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}[k];
    if (n !== undefined && n < game.opts.length){ e.preventDefault(); answer(n); }
  } else if (game.kind === "lightning" && !game.over){
    const g = {"1":"Q","2":"CT","3":"NQ","q":"Q","c":"CT","n":"NQ"}[k];
    if (g){ e.preventDefault(); answerL(g, app.querySelector(`.gq [data-g="${g}"]`)); }
  } else if (game.kind === "map" && !game.locked){
    const n = parseInt(k, 10), cards = app.querySelectorAll(".card-btn");
    if (n >= 1 && n <= cards.length){ e.preventDefault(); cards[n-1].click(); }
  }
});

/* =====================================================================
   BOOT (and keep a run going if the page is updated while it's open)
   ===================================================================== */
renderHome();
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function")
    hot.snapshot(() => game && game.kind === "run" ? { run:{ L:game.L.id, list:game.list, idx:game.idx, streak:game.streak, t0:game.t0 } } : {});
  const resume = d => {
    const r = d && d.run; if (!r || !Array.isArray(r.list) || !r.list.length) return;
    const L = r.L === "daily" ? DAILY : byId(r.L); if (!L || L.map) return;
    game = { kind:"run", L, list:r.list, idx:Math.min(r.idx|0, r.list.length-1), streak:r.streak|0, locked:false, t0:r.t0||Date.now() };
    renderQuestion();
  };
  if (hot && typeof hot.ready === "function") hot.ready(resume); else if (hot && hot.data) resume(hot.data);
} catch(e){}
</script>
</body>
</html>
